spring.application.name=MUJIN
server.port=8080
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

spring.datasource.url=jdbc:h2:file:./data/mujin;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=120000
spring.web.resources.cache.period=0

logging.level.root=INFO
logging.level.com.example.the_greatest_project=INFO

# ---- MUJIN ----
mujin.jwt.secret=${JWT_SECRET:mujin-super-secret-key-change-me-please-0728-global-intelligence-hub}
mujin.jwt.ttl-minutes=720
mujin.claude.api-key=${ANTHROPIC_API_KEY:}
mujin.claude.model=${CLAUDE_MODEL:claude-sonnet-5}
# No API key? Fall back to the locally logged-in Claude Code CLI (subscription account).
mujin.claude.use-cli=${MUJIN_CLAUDE_USE_CLI:true}
# Leave blank to auto-detect on PATH and ~/.local/bin.
mujin.claude.cli-path=${CLAUDE_CLI_PATH:}
mujin.naver.client-id=${NAVER_CLIENT_ID:}
mujin.naver.client-secret=${NAVER_CLIENT_SECRET:}
mujin.news.cache-minutes=8

spring.jackson.default-property-inclusion=non_null
